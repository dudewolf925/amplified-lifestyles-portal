nditions"></div><div class="field"><label>GC / site contact</label><input id="gc" placeholder="GC contact"></div></div>${CHECKS.map((c,i)=>`<div class="check"><p>${i+1}. ${esc(c)}</p><select data-check="${i}"><option value="">Select response</option><option value="verified" ${checkAnswers[i]==='verified'?'selected':''}>Verified / Safe</option><option value="issue" ${checkAnswers[i]==='issue'?'selected':''}>Not verified / Issue found</option><option value="na" ${checkAnswers[i]==='na'?'selected':''}>Not applicable</option></select></div>`).join('')}<div class="field"><label>Site-specific hazards, N/A explanations, controls and corrective actions</label><textarea id="formNotes" placeholder="Required if any item is Not verified or N/A">${esc(formNotes)}</textarea></div></div>`:''}<div class="card"><h2>Acknowledgment</h2><p class="muted">By submitting, I confirm that I reviewed the assigned topic and that my recorded responses are accurate. This acknowledgment does not waive employee rights or replace required training, supervision, or site-specific procedures.</p><label><input id="acknowledge" type="checkbox" style="width:auto"> I acknowledge this review.</label><div class="actions"><button class="btn" id="submitReview">Submit for compliance review</button></div><div class="note">Zoho Sign is disabled. This records a test acknowledgment only, not a legally signed document.</div></div>`}

.skillsmode;skillsActiveAssignment=null;render()});if($('#skillsTechSelect'))$('#skillsTechSelect').onchange=e=>{skillsEmployee=e.target.value;skillsActiveAssignment=null;render()};if($('#publishSkills'))$('#publishSkills').onclick=()=>{const ids=[...document.querySelectorAll('.skillAssignEmployee:checked')].map(x=>x.value),level=$('#skillAssignLevel').value,available=skillBank().filter(q=>level==='all'||q.level===level),count=Number($('#skillAssignCount').value),due=$('#skillAssignDue').value;if(!ids.length)return notify('Select at least one technician.');if(!due||!Number.isInteger(count)||count<1||count>available.length)return notify('Choose a valid due date and a question count within the available bank ('+available.length+').');db.skillAssignments.push({id:uid(),employeeIds:ids,level,count,due,created:new Date().toISOString(),questions:structuredClone(available)});audit('skills.assignment.published',ids.length+' technicians / '+level);render();notify('Skills quiz assigned in this browser demo.')};document.querySelectorAll('[data-start-skill]').forEach(b=>b.onclick=()=>{const a=db.skillAssignments.find(x=>x.id===b.dataset.startSkill);if(!a||!a.employeeIds.includes(skillsEmployee))return;skillsActiveAssignment=a.id;skillsActiveQuestions=shuffle(a.questions).slice(0,a.count).map(q=>structuredClone(q));render()});if($('#cancelSkills'))$('#cancelSkills').onclick=()=>{skillsActiveAssignment=null;skillsActiveQuestions=[];render()};if($('#newSkillQuestion'))$('#newSkillQuestion').onclick=()=>{const q={id:uid(),q:'New installer skills question',domain:'General',level:'Basic',choices:['Choice 1','Choice 2','Choice 3','Choice 4'],answer:0,explanation:'',active:false};db.skillQuestions.push(q);skillsEditorId=q.id;save();render()};document.querySelectorAll('[data-edit-skill]').forEach(b=>b.onclick=()=>{skillsEditorId=b.dataset.editSkill;render();$('#skillEditor')?.scrollIntoView({behavior:'smooth',block:'center'})});if($('#cancelSkillEdit'))$('#cancelSkillEdit').onclick=()=>{skillsEditorId=null;render()};if($('#saveSkillQuestion'))$('#saveSkillQuestion').onclick=()=>{const q=db.skillQuestions.find(x=>x.id===skillsEditorId),choices=[...document.querySelectorAll('[data-skill-choice]')].map(x=>x.value.trim()),question=$('#skillEditText').value.trim();if(!q||!question||choices.length!==4||choices.some(x=>!x)||new Set(choices.map(x=>x.toLowerCase())).size!==4)return notify('Enter a question and four distinct, nonempty answers.');Object.assign(q,{q:question,choices,domain:$('#skillEditDomain').value.trim()||'General',level:$('#skillEditLevel').value,answer:Number($('#skillEditAnswer').value),explanation:$('#skillEditWhy').value.trim(),active:$('#skillEditActive').checked});audit('skills.question.updated',q.id);skillsEditorId=null;render();notify('Question saved for future quiz assignments.')};if($('#gradeSkills'))$('#gradeSkills').onclick=gradeSkills;document.querySelectorAll('[data-skilldetail]').forEach(b=>b.onclick=()=>showSkill(b.dataset.skilldetail));if($('#saveSettings'))$('#saveSettings').onclick=()=>{db.settings.managerEmail=$('#managerEmail').value.trim();db.settings.reminders=$('#reminders').checked;audit('settings.updated','notification settings');notify('Saved locally. No email service is connected.')};if($('#backup'))$('#backup').onclick=()=>download('amplified-portal-backup.json',JSON.stringify(db,null,2));if($('#reset'))$('#reset').onclick=()=>{if(confirm('Delete all local prototype test records?')){localStorage.removeItem(KEY);db=JSON.parse(JSON.stringify(seed));activeAssignment=null;render()}}}
function submitReview(){const a=db.assignments.find(x=>x.id===activeAssignment),weekly=a.type==='weekly';if(!reviewed||!$('#acknowledge').checked)return notify('Review the topic and check the acknowledgment.');if(!weekly&&!quizResult?.passed)return notify('Pass the five-question safety training quiz (80% minimum) before submitting.');if(weekly){if(!$('#siteField').value.trim()||!$('#supervisor').value.trim())return notify('Project/site and supervisor are required.');if(CHECKS.some((_,i)=>!checkAnswers[i]))return notify('Respond to all ten safety checks.');if(Object.values(checkAnswers).some(v=>v!=='verified')&&!formNotes.trim())return notify('Explain issues and N/A responses in the notes.')}let s={id:uid(),assignmentId:a.id,employeeId:employee,submittedAt:new Date().toISOString(),topicVersion:getTopic(a.topicId).version,reviewAcknowledged:true,safetyQuiz:weekly?null:{...quizResult,topicId:a.topicId},signatureStatus:'not_requested',checks:weekly?CHECKS.map((question,i)=>({question,response:checkAnswers[i]})):[],notes:weekly?formNotes:'',hazardCount:weekly?Object.values(checkAnswers).filter(x=>x==='issue').length:0,site:weekly?$('#siteField').value.trim():a.site,supervisor:weekly?$('#supervisor').value.trim():'',weather:weekly?$('#weather').value.trim():'',gc:weekly?$('#gc').value.trim():''};db.submissions.push(s);s.checks.forEach((c,i)=>{if(c.response==='issue')db.actions.push({id:uid(),submissionId:s.id,employeeId:employee,description:`${c.question} — ${s.notes}`,created:s.submittedAt,status:'Open'})});audit('submission.created',getEmp(employee).name+' / '+getTopic(a.topicId).title);activeAssignment=null;render();notify('Test submission recorded locally. Zoho Sign and email were not contacted.')}
function showSubmission(id){const s=db.submissions.find(x=>x.id===id),a=db.assignments.find(x=>x.id===s.assignmentId);$('#submissionDetail').innerHTML=`<div class="card"><h2>Submission details — ${esc(getEmp(s.employeeId)?.name)}</h2><p class="muted">${esc(getTopic(a.topicId)?.title)} · ${esc(s.submittedAt)} · Version ${s.topicVersion}</p><div class="split"><div><strong>Site</strong><p>${esc(s.site||'—')}</p></div><div><strong>Supervisor</strong><p>${esc(s.supervisor||'—')}</p></div><div><strong>Weather</strong><p>${esc(s.weather||'—')}</p></div><div><strong>GC contact</strong><p>${esc(s.gc||'—')}</p></div></div>${s.checks.length?`<table><tr><th>Safety check</th><th>Technician response</th></tr>${s.checks.map(c=>`<tr><td>${esc(c.question)}</td><td>${badge(c.response==='verified'?'Complete':c.response==='issue'?'Needs review':'Not applicable')}</td></tr>`).join('')}</table>`:''}<h3>${a.type==='weekly'?'Safety on Construction Sites (no quiz)':'Safety training quiz'}</h3><p>${s.safetyQuiz?`${s.safetyQuiz.score}% · ${s.safetyQuiz.passed?'Passed':'Not passed'} · ${esc(s.safetyQuiz.at)}`:(a.type==='weekly'?'Not required':'No quiz record')}</p>${s.safetyQuiz?s.safetyQuiz.items.map(x=>`<div class="check"><strong>${esc(x.question)}</strong><p class="muted">Answer: ${esc(x.chosen)} · Correct: ${esc(x.expected)}<br>${esc(x.why)}</p></div>`).join(''):''}<h3>Notes / corrective actions</h3><p>${esc(s.notes||'None')}</p><p class="muted">Acknowledged: ${s.reviewAcknowledged?'Yes':'No'} · Signature: ${esc(s.signatureStatus)} (Zoho disabled)</p></div>`}
function exportCsv(){const rows=[['Technician','Topic','Type','Site','Due','Status']];db.assignments.forEach(a=>a.employeeIds.forEach(e=>rows.push([getEmp(e)?.name,getTopic(a.topicId)?.title,a.type,a.site,a.due,status(a,e)])));download('amplified-compliance.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}
function previewEmail(){let rows=db.assignments.flatMap(a=>a.employeeIds.filter(e=>status(a,e)!=='Complete').map(e=>`${getEmp(e)?.name} — ${getTopic(a.topicId)?.title} — ${status(a,e)} — due ${a.due}`));$('#emailPreview').innerHTML=`<div class="note"><strong>PREVIEW ONLY — not sent</strong><p>To: ${esc(db.settings.managerEmail||'[manager email not configured]')}<br>Subject: Amplified Lifestyles — Outstanding Safety Assignments</p><div class="preview">${esc(rows.length?rows.join('\n'):'No outstanding assignments.')}</div></div>`}
function gradeSkills(){if(!skillsActiveAssignment)return;const responses=skillsActiveQuestions.map((q,i)=>{let x=document.querySelector(`input[name=q${i}]:checked`);return x?Number(x.value):null});if(responses.some(x=>x===null))return notify('Answer all assigned skills questions.');const questions=structuredClone(skillsActiveQuestions),score=Math.round(100*responses.filter((v,i)=>v===questions[i].answer).length/questions.length),a={id:uid(),assignmentId:skillsActiveAssignment,employeeId:skillsEmployee,questions,responses,score,at:new Date().toISOString()};db.skillAttempts.unshift(a);audit('skills.attempt',getEmp(a.employeeId).name+' '+score+'%');skillsActiveAssignment=null;skillsActiveQuestions=[];skillsMode='history';render();showSkill(a.id)}
function showSkill(id){const a=db.skillAttempts.find(x=>x.id===id);if(!a)return;const questions=a.questions||QUESTIONS;$('#skillDetail').innerHTML=`<div class="card"><h2>Answer review: ${esc(getEmp(a.employeeId)?.name)}</h2><p class="muted">Submitted ${esc(a.at)} · Score ${a.score}%</p>${questions.map((q,i)=>({q,i,chosen:a.responses[i],correct:a.responses[i]===q.answer})).map(x=>`<div class="check"><strong>${x.i+1}. ${esc(x.q.q)}</strong><p class="muted">${esc(x.q.domain)} · ${esc(x.q.level)}</p><div class="choice ${x.correct?'good':'bad'}">Technician answered: ${esc(x.q.choices[x.chosen]??'No answer')}</div><div class="choice good">Correct answer: ${esc(x.q.choices[x.q.answer])}</div><p class="muted">${esc(x.q.explanation)}</p></div>`).join('')}</div>`}

render();
</script></body></html>
