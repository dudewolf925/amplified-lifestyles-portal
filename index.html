const CHECKS=['Work area reviewed for energized/exposed or concealed power','Temporary power has required GFCI / grounding protection','Extension cords and cord-connected tools inspected','Correct ladder / lift selected and inspected','Fall exposure and edge/opening controls verified','Penetrations coordinated / utilities located before drilling','PPE matches task and site hazards','Area below overhead work controlled','Cable, reels and packaging will not block access/egress','Crew knows stop-work / reporting contact'];
const SECTIONS=[['C-7 does not mean “risk free”','C-7 communication and low-voltage systems may be energy-limited, but employees still work within active construction environments. Significant hazards can come from surrounding conditions, including temporary power, energized panels, lifts, ladders, open edges, overhead work, drilling, dust, and the activities of other trades. Before starting, identify site-specific hazards and who controls them.'],['Electrical hazards: nearby power can be the real danger','A cable pathway, ceiling space, rack, enclosure, or panel must not be assumed safe solely because the C-7 circuit being installed is low voltage. Identify exposed or concealed energized circuits, control access, inspect cords, and confirm required temporary-power protection.'],['Ladders, edges, overhead work and penetrations','Use the correct ladder and inspect it before use. Do not use improvised platforms. Verify planned drilling and cutting will not contact concealed systems. Control the area below overhead work and address fall hazards.'],['PPE, tools, housekeeping and changing conditions','Select PPE for the hazards, inspect hand and power tools, maintain clear access and egress, and stop and reassess when site conditions change.'],['Site-specific hazard review and stop-work expectations','Identify the highest-risk condition expected for the day and the control needed before exposure. If conditions differ from the plan, stop work and reassess. Production does not override serious hazards.']];
const QUESTIONS=[{domain:'Networking',level:'Moderate',q:'A network camera is not powering on when connected to a PoE switch. What should be checked first?',choices:['Replace the camera immediately','Check the switch PoE budget, port status, and cable connection','Reset the NVR without testing','Replace the monitor'],answer:1,explanation:'Verify the power source and physical link before replacing equipment.'},{domain:'Wiring',level:'Basic',q:'What tool verifies conductor mapping on a terminated Ethernet cable?',choices:['Cable tester','Stud finder','Tone generator only','Laser level'],answer:0,explanation:'A suitable cable tester verifies wire mapping; certification testing may require additional equipment.'},{domain:'Safety',level:'Basic',q:'A ladder has a damaged rung. What should the technician do?',choices:['Use it for one quick task','Have another technician hold it','Remove it from service and report it','Cover the rung with tape'],answer:2,explanation:'Defective ladders must not be used.'},{domain:'Video',level:'Moderate',q:'A 4K video signal fails intermittently over a long HDMI run. What is a sound first diagnostic step?',choices:['Replace the TV immediately','Verify cable and extender capability against signal bandwidth and distance','Increase speaker volume','Disable the network switch'],answer:1,explanation:'Signal bandwidth, cable type, and link capability should be checked systematically.'},{domain:'Audio',level:'Basic',q:'What should be verified before connecting multiple speakers to an amplifier channel?',choices:['Paint color','Speaker impedance/load and amplifier ratings','Camera frame rate','Wi-Fi SSID'],answer:1,explanation:'Excessive load can cause protection trips or damage.'},{domain:'Cameras',level:'Moderate',q:'A PoE camera works in daylight but restarts when infrared LEDs activate. What should be investigated?',choices:['PoE power budget and cable voltage loss','TV remote batteries','Door hinge alignment','Speaker polarity'],answer:0,explanation:'Night mode can increase camera power consumption.'},{domain:'Access Control',level:'Lead',q:'An access-controlled egress door does not release under its required emergency condition. What should happen?',choices:['Bypass the test and sign off','Stop commissioning and escalate for qualified life-safety review','Disable the door contact','Ignore it if the reader works'],answer:1,explanation:'Required egress behavior must be verified and deficiencies corrected by authorized personnel.'}];

const SAFETY_QUIZ=[
 {q:'When working with low-voltage systems on an active construction site, which hazards still need to be evaluated?',choices:['Only low-voltage cable labeling','Nearby energized power and other trade activities','Only the finished equipment rack','Only network connectivity'],answer:1,why:'Low-voltage work can still expose workers to nearby energized circuits and other construction hazards.'},
 {q:'Before using an extension cord on site, what is the best action?',choices:['Inspect it and confirm required electrical protection','Use it if the last crew did','Cover damaged insulation with ordinary tape','Check only its length'],answer:0,why:'Inspect cords and confirm required temporary-power protection before use.'},
 {q:'What should you do if a ladder has a damaged rung?',choices:['Use it with a spotter','Limit use to short tasks','Remove it from service and report it','Place it against a wall'],answer:2,why:'Damaged ladders must not be used.'},
 {q:'Before drilling into a wall or ceiling, what should be checked?',choices:['Only the desired hole size','Whether concealed utilities or energized systems are present','Only the drill battery charge','Only the cable color'],answer:1,why:'Locate and coordinate concealed systems before penetrations.'},

function mondayOf(dateStr){let d=new Date(dateStr+'T12:00:00');if(isNaN(d))d=new Date();let wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return d.toISOString().slice(0,10)}
function demoMeetingsForWeek(week){let start=mondayOf(week);let d=new Date(start+'T12:00:00');return DEMO_MEETINGS.filter(m=>m.status==='scheduled').map(m=>{let t=new Date(d);t.setDate(t.getDate()+m.day);return {...m,date:t.toISOString().slice(0,10)}})}
function projectNames(week){return [...new Set(demoMeetingsForWeek(week).map(m=>m.project))]}
function projectTechs(week,project){return [...new Set(demoMeetingsForWeek(week).filter(m=>m.project===project).flatMap(m=>m.technicians))]}
function defaultWeek(){return mondayOf(today())}
let quizVisible=false,quizResult=null;
function quizFor(t){return t.id==='t1'?SAFETY_QUIZ:(Array.isArray(t.quiz)&&t.quiz.length===5?t.quiz:null)}
function quizMarkup(t){const q=quizFor(t);if(!q)return '<div class="note danger">No topic-specific quiz has been approved for this topic. A manager must add five quiz questions before completion can be recorded.</div>';return `<div class="card" id="safetyQuiz"><h2>Safety Topic Knowledge Check</h2><p class="muted">Five questions · Pass at 80% (4 of 5) · Review incorrect answers and retake if needed.</p>${q.map((x,i)=>`<div class="quiz-box"><strong>${i+1}. ${esc(x.q)}</strong>${x.choices.map((c,j)=>`<label><input type="radio" name="squiz${i}" value="${j}" ${quizAnswers[i]===j?'checked':''}> ${esc(c)}</label>`).join('')}</div>`).join('')}<button class="btn" id="gradeSafety">Check my answers</button>${quizResult?`<div class="note"><div class="quiz-score">${quizResult.score}% — ${quizResult.passed?'Passed':'Review and retake'}</div>${quizResult.items.map(x=>`<p><strong>${x.correct?'✓':'Needs review'}: ${esc(x.question)}</strong><br>Your answer: ${esc(x.chosen)}<br>Correct answer: ${esc(x.expected)}<br>${esc(x.why)}</p>`).join('')}${!quizResult.passed?'<button class="btn secondary" id="retrySafety">Retake quiz</button>':''}</div>`:''}</div>`}
function gradeSafety(){const a=db.assignments.find(x=>x.id===activeAssignment),t=getTopic(a.topicId),q=quizFor(t);if(!q)return;let ans=q.map((_,i)=>document.querySelector(`input[name=squiz${i}]:checked`));if(ans.some(x=>!x))return notify('Answer all five safety quiz questions.');quizAnswers=Object.fromEntries(ans.map((x,i)=>[i,Number(x.value)]));const score=20*q.filter((x,i)=>x.answer===quizAnswers[i]).length;quizResult={score,passed:score>=80,items:q.map((x,i)=>({question:x.q,chosen:x.choices[quizAnswers[i]],expected:x.choices[x.answer],correct:x.answer===quizAnswers[i],why:x.why})),at:new Date().toISOString()};render();document.getElementById('safetyQuiz')?.scrollIntoView({behavior:'smooth',block:'start'})}

function refreshAssignmentChooser(){let week=$('#assignWeek')?.value||defaultWeek(),group=$('#assignGroup')?.value||'site',area=$('#projectSelectArea'),sel=$('#assignProject');if(!area)return;area.style.display=group==='site'?'block':'none';if(group==='site'){let old=sel.value,projects=projectNames(week);sel.innerHTML=projects.length?projects.map(x=>`<option value="${esc(x)}" ${x===old?'selected':''}>${esc(x)}</option>`).join(''):'<option value="">No scheduled projects for this week</option>'}let ids=group==='site'?projectTechs(week,sel.value):db.employees.filter(e=>e.active).map(e=>e.id);$('#assignedTechnicians').innerHTML=ids.length?ids.map(id=>`<label style="display:block;margin:10px 0"><input type="checkbox" class="assignEmployee" value="${esc(id)}" checked> ${esc(getEmp(id)?.name)}</label>`).join(''):'<p class="muted">No technicians scheduled for this selection.</p>'}

const KEY='amplified_lifestyles_portal_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{db=JSON.parse(JSON.stringify(seed))}let page='overview',subtab='overview',employee='e1',activeAssignment=null,quizAnswers={},checkAnswers={},formNotes='',reviewed=false,filterMissed=true;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toISOString().slice(0,10);const uid=()=>Math.random().toString(36).slice(2,11);function save(){localStorage.setItem(KEY,JSON.stringify(db))}function audit(action,detail){db.audit.unshift({at:new Date().toISOString(),action,detail});save()}function getEmp(id){return db.employees.find(x=>x.id===id)}function getTopic(id){return db.topics.find(x=>x.id===id)}function submission(a,e){return db.submissions.find(x=>x.assignmentId===a.id&&x.employeeId===e)}function status(a,e){let s=submission(a,e);return s?(s.hazardCount?'Needs review':s.signatureStatus==='pending'?'Awaiting signature':'Complete'):new Date(a.due+'T23:59:59')<new Date()?'Overdue':'Pending'}function badge(s){return `<span class="pill ${s==='Complete'?'good':s==='Overdue'||s==='Needs review'?'bad':'wait'}">${esc(s)}</span>`}function notify(m){alert(m)}function download(name,content,mime='application/json'){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),300)}

function overview(){let all=db.assignments.flatMap(a=>a.employeeIds.map(e=>status(a,e))),complete=all.filter(s=>s==='Complete').length;return `<h1>Manager Overview</h1><p class="muted">Two connected management areas, with separate qualification and safety records.</p><div class="grid"><div class="card"><h2>Skills</h2><div class="metric">${db.skillAttempts.length}</div><p class="muted">Assessment attempts recorded</p><button class="btn" data-go="skills">Open Skills</button></div><div class="card"><h2>Safety Compliance</h2><div class="metric">${complete} / ${all.length}</div><p class="muted">Completed assignment records</p><button class="btn" data-go="safety">Open Safety</button></div><div class="card"><h2>Follow-up</h2><div class="metric">${all.filter(s=>['Overdue','Needs review','Awaiting signature'].includes(s)).length}</div><p class="muted">Outstanding safety records</p><button class="btn secondary" data-go="safety">Review outstanding</button></div></div><div class="card"><h2>Testing checklist</h2><p>1. Publish a weekly topic and assign technicians. 2. Switch to Technician View and complete an assignment. 3. Review submitted responses and exceptions in Safety Compliance. 4. Test incorrect-answer reporting in Skills. 5. Export records for review.</p><div class="note">This prototype saves data in this browser only. It does not authenticate employees, synchronize between devices, send email, or request Zoho signatures.</div></div>`}

function safetyOverview(){const rows=db.assignments.flatMap(a=>a.employeeIds.map(e=>({a,e,s:status(a,e)})));return `<div class="grid"><div class="card"><div class="muted">Assigned</div><div class="metric">${rows.length}</div></div><div class="card"><div class="muted">Completed</div><div class="metric">${rows.filter(r=>r.s==='Complete').length}</div></div><div class="card"><div class="muted">Outstanding</div><div class="metric">${rows.filter(r=>r.s!=='Complete').length}</div></div></div><div class="card"><div class="row"><h2>Assignments and status</h2><button class="btn" data-tab="assign">Assign topic</button></div>${rows.length?`<table><thead><tr><th>Technician</th><th>Topic</th><th>Due</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(getEmp(r.e)?.name)}</td><td>${esc(getTopic(r.a.topicId)?.title)}</td><td>${esc(r.a.due)}</td><td>${badge(r.s)}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">No assignments yet. Assign a weekly safety topic to begin testing.</p>'}</div><div class="card"><h2>Weekly schedule</h2><p class="muted">Use the assignment screen to publish the weekly topic. Recurring automatic publication requires the production scheduler and shared backend.</p><div class="note">The uploaded source cites California toolbox/tailgate meetings at least every 10 working days. Weekly individual reviews and documented crew meetings are tracked as distinct record types in the production design.</div></div>`}
function topics(){return `<div class="card"><div class="row"><h2>Topic Library</h2><span class="pill">${db.topics.length} topics</span></div>${db.topics.map(t=>`<div class="check"><div class="row"><div><strong>${esc(t.title)}</strong><p class="muted">${esc(t.category)} · Version ${t.version} · ${esc(t.source||'Manager authored')}</p></div><button class="btn secondary" data-preview="${t.id}">Preview</button></div></div>`).join('')}</div><div class="card"><h2>Add a safety topic</h2><div class="split"><div class="field"><label>Topic title</label><input id="topicTitle" placeholder="e.g. Retrofit dust containment"></div><div class="field"><label>Category</label><select id="topicCat"><option>New Construction</option><option>Retrofit</option><option>Electrical</option><option>Ladders & Falls</option><option>PPE & Tools</option><option>General Safety</option></select></div></div><div class="field"><label>Topic content (paste text or import a text file)</label><textarea id="topicText" placeholder="Training content..."></textarea></div><div class="field"><label>Optional local file import (TXT or MD; read into topic)</label><input type="file" id="topicFile" accept=".txt,.md,text/plain,text/markdown"></div><button class="btn" id="addTopic">Save topic</button><div class="note">PDF/video attachment hosting is planned for the production backend. This local prototype accepts text content and text-file imports; it does not upload files to a server.</div></div><div id="topicPreview"></div>`}

function reports(){const rows=db.assignments.flatMap(a=>a.employeeIds.map(e=>({technician:getEmp(e)?.name,topic:getTopic(a.topicId)?.title,type:a.type,site:a.site,due:a.due,status:status(a,e)})));return `<div class="card"><h2>Compliance reporting</h2><p class="muted">Export assignment status and response history for offline review.</p><div class="actions"><button class="btn" id="exportCsv">Export compliance CSV</button><button class="btn secondary" id="exportJson">Export full test data JSON</button><button class="btn secondary" id="previewEmail">Preview overdue email</button></div><div id="emailPreview"></div></div><div class="card"><h2>Assignment status</h2>${rows.length?`<table><tr><th>Technician</th><th>Topic</th><th>Due</th><th>Status</th></tr>${rows.map(r=>`<tr><td>${esc(r.technician)}</td><td>${esc(r.topic)}</td><td>${esc(r.due)}</td><td>${badge(r.status)}</td></tr>`).join('')}</table>`:'<p class="muted">No report data yet.</p>'}</div>`}
function technician(){let pending=db.assignments.filter(a=>a.employeeIds.includes(employee)&&!submission(a,employee));let done=db.assignments.filter(a=>a.employeeIds.includes(employee)&&submission(a,employee));return `<h1>Technician Portal</h1><p class="muted">Test a technician's review, checklist, and acknowledgment workflow.</p><div class="card"><div class="field"><label>Acting as (demo only — not authentication)</label><select id="employee">${db.employees.map(e=>`<option value="${e.id}" ${employee===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div></div>${activeAssignment?technicianForm():`<div class="card"><h2>Assignments to complete</h2>${pending.length?pending.map(a=>`<div class="check row"><div><strong>${esc(getTopic(a.topicId)?.title)}</strong><div class="muted">${esc(a.type)} · Due ${esc(a.due)} · ${esc(a.site||'All sites')}</div></div><button class="btn" data-start="${a.id}">Start review</button></div>`).join(''):'<p class="muted">No pending assignments for this technician.</p>'}</div><div class="card"><h2>Completed reviews</h2>${done.length?done.map(a=>`<p>${esc(getTopic(a.topicId)?.title)} ${badge(status(a,employee))}</p>`).join(''):'<p class="muted">No completed reviews yet.</p>'}</div>`}`}
function technicianForm(){const a=db.assignments.find(x=>x.id===activeAssignment),t=getTopic(a.topicId),weekly=a.type==='weekly';return `<div class="card"><div class="row"><h2>${esc(t.title)}</h2><button class="btn secondary" id="cancelReview">Back</button></div><div class="muted">${esc(t.category)} · Version ${t.version} · Due ${esc(a.due)}</div><div class="note">Source material is adapted for browser review from the supplied Amplified Lifestyles construction safety talk. Review company procedures and applicable site requirements.</div><div class="preview" style="max-height:420px;margin:15px 0">${esc(t.content)}</div><label><input id="reviewed" type="checkbox" ${reviewed?'checked':''} style="width:auto"> I reviewed the assigned safety topic and had an opportunity to ask questions.</label></div>${quizVisible?quizMarkup(t):'<div class="note">Check “I reviewed the assigned safety topic” to open the required five-question quiz.</div>'}${weekly?`<div class="card"><h2>Pre-Task C-7 Construction Safety Check</h2><div class="split"><div class="field"><label>Project / site</label><input id="siteField" value="${esc(a.site||'')}" placeholder="Required site"></div><div class="field"><label>Supervisor / presenter</label><input id="supervisor" placeholder="Supervisor name"></div><div class="field"><label>Weather / site conditions</label><input id="weather" placeholder="Conditions"></div><div class="field"><label>GC / site contact</label><input id="gc" placeholder="GC contact"></div></div>${CHECKS.map((c,i)=>`<div class="check"><p>${i+1}. ${esc(c)}</p><select data-check="${i}"><option value="">Select response</option><option value="verified" ${checkAnswers[i]==='verified'?'selected':''}>Verified / Safe</option><option value="issue" ${checkAnswers[i]==='issue'?'selected':''}>Not verified / Issue found</option><option value="na" ${checkAnswers[i]==='na'?'selected':''}>Not applicable</option></select></div>`).join('')}<div class="field"><label>Site-specific hazards, N/A explanations, function skills(){let attempts=db.skillAttempts;return `<h1>Skills Assessment</h1><p class="muted">Demonstration question set. The full 245-question production bank and practical assessments remain a separate content-development milestone.</p><div class="grid"><div class="card"><div class="muted">Attempts</div><div class="metric">${attempts.length}</div></div><div class="card"><div class="muted">Questions in demo</div><div class="metric">${QUESTIONS.length}</div></div><div class="card"><div class="muted">Missed answers</div><div class="metric">${attempts.reduce((n,a)=>n+a.responses.filter((v,i)=>v!==QUESTIONS[i].answer).length,0)}</div></div></div><div class="card"><h2>Run a demo assessment</h2><div class="field"><label>Technician</label><select id="skillsEmployee">${db.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>${QUESTIONS.map((q,i)=>`<div class="check"><strong>${i+1}. ${esc(q.q)}</strong><p class="muted">${esc(q.domain)} · ${esc(q.level)}</p>${q.choices.map((c,j)=>`<label style="display:block;margin:8px 0"><input type="radio" name="q${i}" value="${j}" style="width:auto"> ${esc(c)}</label>`).join('')}</div>`).join('')}<button class="btn" id="gradeSkills">Submit demo assessment</button></div><div class="card"><h2>Manager assessment history</h2>${attempts.length?attempts.map(a=>`<div class="check row"><div><strong>${esc(getEmp(a.employeeId)?.name)}</strong><div class="muted">${esc(a.at)} · ${a.score}% · ${a.responses.filter((v,i)=>v!==QUESTIONS[i].answer).length} missed</div></div><button class="btn secondary" data-skilldetail="${a.id}">Inspect answers</button></div>`).join(''):'<p class="muted">No demo attempts yet.</p>'}</div><div id="skillDetail"></div>`}
function settings(){return `<h1>Settings & Integrations</h1><p class="muted">Integration boundaries are defined now; live services remain disconnected until approved testing.</p><div class="card"><h2>Notification configuration</h2><div class="field"><label>Manager email for future overdue reports</label><input id="managerEmail" type="email" value="${esc(db.settings.managerEmail)}" placeholder="safety-manager@company.com"></div><label><input id="reminders" type="checkbox" ${db.settings.reminders?'checked':''} style="width:auto"> Enable reminders when email service is connected</label><div class="actions"><button class="btn" id="saveSettings">Save configuration</button></div><div class="note">No emails are sent from this prototype. Reports can be previewed in Safety Compliance → Reports.</div></div><div class="card"><h2>Zoho Sign integration — disabled</h2><p>Future adapter contract:</p><pre class="preview">signatureProvider.createRequest({submissionId, documentVersion, recipients, documentUrl})\nsignatureProvider.getStatus(requestId)\nsignatureProvider.handleWebhook(event)\nsignatureProvider.getSignedArtifact(requestId)</pre><p class="muted">Proposed states: not_required → pending → signed / declined / expired / failed. Store request IDs, verified webhook events, signed artifact references and audit evidence in the production database.</p><span class="pill wait">Not connected</span></div><div class="card"><h2>Local test data</h2><div class="actions"><button class="btn secondary" id="backup">Download backup JSON</button><button class="btn warn" id="reset">Reset all browser test data</button></div><div class="note danger">Browser storage is not a secure compliance record system. Do not enter real employee information or rely on these records for OSHA/Cal-OSHA compliance.</div></div>`}
function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{subtab=b.dataset.tab;render()});if($('#employee'))$('#employee').onchange=e=>{employee=e.target.value;activeAssignment=null;render()};if($('#topicFile'))$('#topicFile').onchange=async e=>{let f=e.target.files[0];if(f)$('#topicText').value=await f.text()};if($('#addTopic'))$('#addTopic').onclick=()=>{let title=$('#topicTitle').value.trim(),content=$('#topicText').value.trim();if(!title||!content)return notify('Enter a title and topic content.');db.topics.push({id:uid(),title,category:$('#topicCat').value,content,version:1,source:'Manager-authored test topic',created:today()});audit('topic.created',title);render()};document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{let t=getTopic(b.dataset.preview);$('#topicPreview').innerHTML=`<div class="card"><h2>${esc(t.title)}</h2><div class="preview">${esc(t.content)}</div></div>`});if($('#assignWeek')){refreshAssignmentChooser();$('#assignWeek').onchange=refreshAssignmentChooser;$('#assignGroup').onchange=refreshAssignmentChooser;$('#assignProject').onchange=refreshAssignmentChooser}if($('#publish'))$('#publish').onclick=()=>{let ids=[...document.querySelectorAll('.assignEmployee:checked')].map(x=>x.value),due=$('#assignDue').value;if(!ids.length||!due)return notify('Choose a scheduled project or group, at least one technician, and a due date.');if(!quizFor(getTopic($('#assignTopic').value)))return notify('This topic needs an approved five-question quiz before it can be assigned.');let type=$('#assignType').value;db.assignments.push({id:uid(),topicId:$('#assignTopic').value,type,due,site:$('#assignGroup').value==='service'?'Service & Special Projects — Group Training':$('#assignProject').value,week:mondayOf($('#assignWeek').value),group:$('#assignGroup').value,employeeIds:ids,created:new Date().toISOString()});audit('assignment.published',type+' / '+ids.length+' technicians');render()};document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{activeAssignment=b.dataset.start;quizAnswers={};checkAnswers={};formNotes='';reviewed=false;quizVisible=false;quizResult=null;render()});if($('#cancelReview'))$('#cancelReview').onclick=()=>{activeAssignment=null;render()};document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>checkAnswers[Number(x.dataset.check)]=x.value);if($('#reviewed'))$('#reviewed').onchange=e=>{reviewed=e.target.checked;quizVisible=reviewed;quizResult=null;quizAnswers={};render();if(reviewed)document.getElementById('safetyQuiz')?.scrollIntoView({behavior:'smooth',block:'start'})};if($('#gradeSafety'))$('#gradeSafety').onclick=gradeSafety;if($('#retrySafety'))$('#retrySafety').onclick=()=>{quizResult=null;quizAnswers={};render()};if($('#formNotes'))$('#formNotes').oninput=e=>formNotes=e.target.value;if($('#submitReview'))$('#submitReview').onclick=submitReview;document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showSubmission(b.dataset.detail));document.querySelectorAll('[data-closeaction]').forEach(b=>b.onclick=()=>{let a=db.actions.find(x=>x.id===b.dataset.closeaction);a.status='Closed';audit('action.closed',a.description);render()});if($('#exportCsv'))$('#exportCsv').onclick=exportCsv;if($('#exportJson'))$('#exportJson').onclick=()=>download('amplified-test-data.json',JSON.stringify(db,null,2));if($('#previewEmail'))$('#previewEmail').onclick=previewEmail;if($('#gradeSkills'))$('#gradeSkills').onclick=gradeSkills;document.querySelectorAll('[data-skilldetail]').forEach(b=>b.onclick=()=>showSkill(b.dataset.skilldetail));if($('#saveSettings'))$('#saveSettings').onclick=()=>{db.settings.managerEmail=$('#managerEmail').value.trim();db.settings.reminders=$('#reminders').checked;audit('settings.updated','notification settings');notify('Saved locally. No email service is connected.')};if($('#backup'))$('#backup').onclick=()=>download('amplified-portal-backup.json',JSON.stringify(db,null,2));if($('#reset'))$('#reset').onclick=()=>{if(confirm('Delete all local prototype test records?')){localStorage.removeItem(KEY);db=JSON.parse(JSON.stringify(seed));activeAssignment=null;render()}}}
function submitReview(){const a=db.assignments.find(x=>x.id===activeAssignment),weekly=a.type==='weekly';if(!reviewed||!$('#acknowledge').checked)return notify('Review the topic and check the acknowledgment.');if(!quizResult?.passed)return notify('Pass the five-question safety quiz (80% minimum) before submitting.');if(weekly){if(!$('#siteField').value.trim()||!$('#supervisor').value.trim())return notify('Project/site and supervisor are required.');if(CHECKS.some((_,i)=>!checkAnswers[i]))return notify('Respond to all ten safety checks.');if(Object.values(checkAnswers).some(v=>v!=='verified')&&!formNotes.trim())return notify('Explain issues and N/A responses in the notes.')}let s={id:uid(),assignmentId:a.id,employeeId:employee,submittedAt:new Date().toISOString(),topicVersion:getTopic(a.topicId).version,reviewAcknowledged:true,safetyQuiz:{...quizResult,topicId:a.topicId},signatureStatus:'not_requested',checks:weekly?CHECKS.map((question,i)=>({question,response:checkAnswers[i]})):[],notes:weekly?formNotes:'',hazardCount:weekly?Object.values(checkAnswers).filter(x=>x==='issue').length:0,site:weekly?$('#siteField').value.trim():a.site,supervisor:weekly?$('#supervisor').value.trim():'',weather:weekly?$('#weather').value.trim():'',gc:weekly?$('#gc').value.trim():''};db.submissions.push(s);s.checks.forEach((c,i)=>{if(c.response==='issue')db.actions.push({id:uid(),submissionId:s.id,employeeId:employee,description:`${c.question} — ${s.notes}`,created:s.submittedAt,status:'Open'})});audit('submission.created',getEmp(employee).name+' / '+getTopic(a.topicId).title);activeAssignment=null;render();notify('Test submission recorded locally. Zoho Sign and email were not contacted.')}
function showSubmission(id){const s=db.submissions.find(x=>x.id===id),a=db.assignments.find(x=>x.id===s.assignmentId);$('#submissionDetail').innerHTML=`<div class="card"><h2>Submission details — ${esc(getEmp(s.employeeId)?.name)}</h2><p class="muted">${esc(getTopic(a.topicId)?.title)} · ${esc(s.submittedAt)} · Version ${s.topicVersion}</p><div class="split"><div><strong>Site</strong><p>${esc(s.site||'—')}</p></div><div><strong>Supervisor</strong><p>${esc(s.supervisor||'—')}</p></div><div><strong>Weather</strong><p>${esc(s.weather||'—')}</p></div><div><strong>GC contact</strong><p>${esc(s.gc||'—')}</p></div></div>${s.checks.length?`<table><tr><th>Safety check</th><th>Technician response</th></tr>${s.checks.map(c=>`<tr><td>${esc(c.question)}</td><td>${badge(c.response==='verified'?'Complete':c.response==='issue'?'Needs review':'Not applicable')}</td></tr>`).join('')}</table>`:''}<h3>Safety quiz</h3><p>${s.safetyQuiz?`${s.safetyQuiz.score}% · ${s.safetyQuiz.passed?'Passed':'Not passed'} · ${esc(s.safetyQuiz.at)}`:'No quiz record (legacy test submission)'}</p>${s.safetyQuiz?s.safetyQuiz.items.map(x=>`<div class="check"><strong>${esc(x.question)}</strong><p class="muted">Answer: ${esc(x.chosen)} · Correct: ${esc(x.expected)}<br>${esc(x.why)}</p></div>`).join(''):''}<h3>Notes / corrective actions</h3><p>${esc(s.notes||'None')}</p><p class="muted">Acknowledged: ${s.reviewAcknowledged?'Yes':'No'} · Signature: ${esc(s.signatureStatus)} (Zoho disabled)</p></div>`}
function exportCsv(){const rows=[['Technician','Topic','Type','Site','Due','Status']];db.assignments.forEach(a=>a.employeeIds.forEach(e=>rows.push([getEmp(e)?.name,getTopic(a.topicId)?.title,a.type,a.site,a.due,status(a,e)])));download('amplified-compliance.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}
function previewEmail(){let rows=db.assignments.flatMap(a=>a.employeeIds.filter(e=>status(a,e)!=='Complete').map(e=>`${getEmp(e)?.name} — ${getTopic(a.topicId)?.title} — ${status(a,e)} — due ${a.due}`));$('#emailPreview').innerHTML=`<div class="note"><strong>PREVIEW ONLY — not sent</strong><p>To: ${esc(db.settings.managerEmail||'[manager email not configured]')}<br>Subject: Amplified Lifestyles — Outstanding Safety Assignments</p><div class="preview">${esc(rows.length?rows.join('\n'):'No outstanding assignments.')}</div></div>`}
function gradeSkills(){let responses=QUESTIONS.map((q,i)=>{let x=document.querySelector(`input[name=q${i}]:checked`);return x?Number(x.value):null});if(responses.some(x=>x===null))return notify('Answer all demo questions.');let score=Math.round(100*responses.filter((v,i)=>v===QUESTIONS[i].answer).length/QUESTIONS.length),a={id:uid(),employeeId:$('#skillsEmployee').value,responses,score,at:new Date().toISOString()};db.skillAttempts.unshift(a);audit('skills.attempt',getEmp(a.employeeId).name+' '+score+'%');render();showSkill(a.id)}
function showSkill(id){const a=db.skillAttempts.find(x=>x.id===id);$('#skillDetail').innerHTML=`<div class="card"><h2>Incorrect-answer review: ${esc(getEmp(a.employeeId)?.name)}</h2><p class="muted">Submitted ${esc(a.at)} · Score ${a.score}%</p>${QUESTIONS.map((q,i)=>({q,i,chosen:a.responses[i],correct:a.responses[i]===q.answer})).filter(x=>!filterMissed||!x.correct).map(x=>`<div class="check"><strong>${x.i+1}. ${esc(x.q.q)}</strong><p class="muted">${esc(x.q.domain)} · ${esc(x.q.level)}</p><div class="choice ${x.correct?'good':'bad'}">Technician answered: ${esc(x.q.choices[x.chosen])}</div><div class="choice good">Correct answer: ${esc(x.q.choices[x.q.answer])}</div><p class="muted">${esc(x.q.explanation)}</p></div>`).join('')||'<p>No incorrect answers.</p>'}</div>`}
render();
</script></body></html>
