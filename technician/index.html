<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMPLIFIED | Technician Portal</title><link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png"><meta name="theme-color" content="#0b0b0b"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f2f4f7;font:16px/1.5 system-ui,-apple-system,sans-serif}header{background:#08090a;border-bottom:1px solid #35383d;padding:20px max(18px,calc((100vw - 920px)/2))}header img{max-width:320px;width:100%;height:75px;object-fit:contain;object-position:left}main{max-width:920px;margin:auto;padding:22px 16px 70px}h1{font-size:27px;margin:8px 0}h2{font-size:20px;margin:0 0 12px}.muted{color:#bbc1cb}.card{background:#171a20;border:1px solid #383e47;border-radius:14px;padding:19px;margin:15px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{background:#f5f5f5;color:#111;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#343943;color:white}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{border:1px solid #555;background:#22262d;color:#fff;padding:10px 17px;border-radius:9px;cursor:pointer}.tabs button.active{background:#eee;color:#111}.pill{border-radius:20px;background:#323942;color:white;padding:5px 10px;font-size:12px}.good{color:#9ee5b6}.warn{color:#ffce83}.item{padding:15px 0;border-top:1px solid #34383f}.item:first-of-type{border:0}input,select,textarea{background:#101216;border:1px solid #626a74;color:white;border-radius:7px;padding:11px;width:100%;font:inherit}input[type=checkbox],input[type=radio]{width:auto;accent-color:#fff}label{display:block;margin:12px 0}.field{margin:14px 0}.preview{white-space:pre-wrap;max-height:320px;overflow:auto;padding:15px;background:#101216;border:1px solid #333;border-radius:8px}.question{padding:16px 0;border-top:1px solid #444}.question label{padding:10px;background:#272c34;border-radius:8px;color:white}.note{padding:13px;background:#252b33;border-radius:9px;margin:14px 0}.overlay{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:10px;z-index:9}.modal{background:#161a20;border:1px solid #666;border-radius:14px;padding:20px;max-width:660px;width:100%;max-height:94vh;overflow:auto}.hidden{display:none}footer{color:#aeb5bf;font-size:12px;padding:30px 0}</style></head><body><header><img src="../assets/branding/amplified-banner.png" alt="AMPLIFIED"><div class="muted">TECHNICIAN PORTAL</div></header><main><div class="row"><div><h1>My Assignments</h1><div class="muted">Only assigned work, due dates and completed records</div></div><div><label for="person">Technician (demo)</label><select id="person"></select></div></div><div class="tabs"><button data-tab="due" class="active">Due</button><button data-tab="completed">Completed</button></div><div id="content"></div><footer>Demonstration only. No technician authentication or cross-device synchronization. Assignments and results are stored in this browser.</footer></main><div class="overlay hidden" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Safety training quiz"><div class="row"><h2>Safety Training Quiz</h2><button class="btn secondary" id="close">Close ✕</button></div><div id="quiz"></div></div></div><script>
const KEY='amplified_lifestyles_portal_v1',CHECKS=['Work area reviewed for energized/exposed or concealed power','Temporary power has required GFCI / grounding protection','Extension cords and cord-connected tools inspected','Correct ladder / lift selected and inspected','Fall exposure and edge/opening controls verified','Penetrations coordinated / utilities located before drilling','PPE matches task and site hazards','Area below overhead work controlled','Cable, reels and packaging will not block access/egress','Crew knows stop-work / reporting contact'];
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{employees:[],topics:[],assignments:[],submissions:[],skillAssignments:[],skillAttempts:[],actions:[],audit:[]};db.submissions ||= [];db.skillAttempts ||= [];db.actions ||= [];db.audit ||= [];let who=db.employees?.[0]?.id||'',tab='due',active=null,kind='',reviewed=false,quizSet=[],quizResult=null,skillSet=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,12),shuffle=a=>[...a].sort(()=>Math.random()-.5),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),topic=id=>db.topics.find(t=>t.id===id),done=a=>db.submissions.find(s=>s.assignmentId===a.id&&s.employeeId===who),skillDone=a=>db.skillAttempts.find(s=>s.assignmentId===a.id&&s.employeeId===who),dateDue=d=>d&&new Date(d+'T23:59:59')<new Date();
function render(){const ps=$('#person');ps.innerHTML=(db.employees||[]).map(e=>`<option value="${esc(e.id)}" ${who===e.id?'selected':''}>${esc(e.name)}</option>`).join('');if(!db.employees?.length){$('#content').innerHTML='<div class="card">No technicians are available in this browser. A manager must first create demo assignments in the manager portal on this same browser.</div>';return}document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const safety=db.assignments.filter(a=>a.employeeIds.includes(who)).filter(a=>tab==='completed'?!!done(a):!done(a));const skills=(db.skillAssignments||[]).filter(a=>a.employeeIds.includes(who)).filter(a=>tab==='completed'?!!skillDone(a):!skillDone(a));const grouped=[...safety.map(a=>({a,k:'safety'})),...skills.map(a=>({a,k:'skills'}))].sort((x,y)=>String(x.a.due).localeCompare(String(y.a.due)));$('#content').innerHTML=grouped.length?grouped.map(({a,k})=>{const t=k==='safety'?topic(a.topicId):null;const isWeekly=k==='safety'&&a.type==='weekly';const name=k==='skills'?`Installer Skills — ${a.level==='all'?'Mixed Levels':a.level}`:isWeekly?'Safety on Construction Sites':t?.title||'Safety Topic';const complete=k==='skills'?skillDone(a):done(a);return `<div class="card"><div class="row"><div><span class="pill">${k==='skills'?'Skills Quiz':isWeekly?'Weekly Safety Check':'Safety Training'}</span><h2 style="margin-top:12px">${esc(name)}</h2><div class="muted">${esc(a.site||'')} · Due ${esc(a.due)}</div></div><div>${complete?'<span class="good">Completed ✓</span>':dateDue(a.due)?'<span class="warn">Overdue</span>':'<span class="pill">Due</span>'}</div></div>${complete?`<p class="muted">Submitted ${esc(complete.submittedAt||complete.at)}${complete.score!=null?' · Score '+complete.score+'%':complete.safetyQuiz?' · Score '+complete.safetyQuiz.score+'%':''}</p>${!isWeekly?`<button class="btn secondary" data-review="${esc(a.id)}" data-kind="${k}">Review ${k==='skills'?'quiz':'training topic'}</button>`:'<p class="muted">Weekly safety check recorded. No duplicate construction safety document is shown in completed items.</p>'}`:`<button class="btn" data-start="${esc(a.id)}" data-kind="${k}">Open assignment</button>`}</div>`}).join(''):'<div class="card">No '+(tab==='due'?'outstanding':'completed')+' assignments for this technician.</div>';document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start,b.dataset.kind));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(b.dataset.review,b.dataset.kind))}
function start(id,k){active=id;kind=k;reviewed=false;quizSet=[];quizResult=null;skillSet=[];if(k==='skills'){const a=db.skillAssignments.find(x=>x.id===id);skillSet=shuffle(a.questions||[]).slice(0,a.count);showSkills();return}const a=db.assignments.find(x=>x.id===id),t=topic(a.topicId),weekly=a.type==='weekly';$('#content').innerHTML=`<div class="card"><button class="btn secondary" id="back">← My assignments</button><h2 style="margin-top:20px">${esc(weekly?'Safety on Construction Sites':t?.title)}</h2><p class="muted">Due ${esc(a.due)} · ${esc(a.site||'')}</p>${t?.pdfPath?`<p><a class="btn secondary" href="../${esc(t.pdfPath)}" target="_blank" rel="noopener">Open training PDF</a></p>`:''}<div class="preview">${esc(t?.content||'Read the assigned document.')}</div><label><input type="checkbox" id="reviewed"> I have reviewed this ${weekly?'construction safety document':'training topic'}.</label></div>${weekly?`<div class="card"><h2>Pre-Task Safety Check</h2><div class="field"><label>Project / site<input id="site" value="${esc(a.site||'')}"></label></div><div class="field"><label>Supervisor<input id="supervisor"></label></div>${CHECKS.map((c,i)=>`<div class="field"><label>${i+1}. ${esc(c)}<select data-check="${i}"><option value="">Select response</option><option value="verified">Verified / Safe</option><option value="issue">Issue found</option><option value="na">Not applicable</option></select></label></div>`).join('')}<label>Hazards, controls and N/A explanations<textarea id="notes" rows="4"></textarea></label></div>`:'<div class="card"><p id="quizstatus">Review the training to unlock the randomized five-question quiz.</p><button class="btn secondary hidden" id="launch">Open quiz</button></div>'}<div class="card"><label><input type="checkbox" id="ack"> I acknowledge that my responses are accurate.</label><button class="btn" id="submit">Submit ${weekly?'Safety Check':'Training'}</button></div>`;$('#back').onclick=()=>{active=null;render()};$('#reviewed').onchange=e=>{reviewed=e.target.checked;if(!weekly){$('#launch').classList.toggle('hidden',!reviewed);if(reviewed)openQuiz()}};if(!weekly)$('#launch').onclick=openQuiz;$('#submit').onclick=()=>submitSafety(a,weekly)}
function openQuiz(){if(!reviewed)return;const a=db.assignments.find(x=>x.id===active),t=topic(a.topicId),bank=(t?.quizBank||[]).filter(q=>q.approved!==false);if(bank.length<5)return alert('This topic needs five approved questions.');if(!quizSet.length)quizSet=shuffle(bank).slice(0,5);$('#quiz').innerHTML=quizSet.map((q,i)=>`<div class="question"><strong>${i+1}. ${esc(q.q)}</strong>${q.choices.map((c,j)=>`<label><input type="radio" name="sq${i}" value="${j}"> ${esc(c)}</label>`).join('')}</div>`).join('')+`<button class="btn" id="grade">Submit answers</button>`;$('#grade').onclick=()=>{const responses=quizSet.map((q,i)=>document.querySelector(`input[name=sq${i}]:checked`)?.value);if(responses.some(x=>x==null))return alert('Answer all five questions.');const score=20*quizSet.filter((q,i)=>q.answer===Number(responses[i])).length;quizResult={score,passed:score>=80,at:new Date().toISOString(),items:quizSet.map((q,i)=>({question:q.q,chosen:q.choices[Number(responses[i])],expected:q.choices[q.answer],correct:q.answer===Number(responses[i]),why:q.why||''}))};$('#quiz').innerHTML=`<h2>${score}% — ${quizResult.passed?'Passed':'Retake required'}</h2>${quizResult.items.map(x=>`<div class="question"><strong>${esc(x.question)}</strong><p>${esc(x.correct?'Correct':'Needs review')} · Your answer: ${esc(x.chosen)}<br>Correct answer: ${esc(x.expected)}<br>${esc(x.why)}</p></div>`).join('')}${!quizResult.passed?'<button class="btn" id="retry">Try different questions</button>':''}`;if(!quizResult.passed)$('#retry').onclick=()=>{quizSet=[];quizResult=null;openQuiz()};else $('#quizstatus').textContent='Quiz passed: '+score+'%'};$('#overlay').classList.remove('hidden')}
function submitSafety(a,weekly){if(!reviewed||!$('#ack').checked)return alert('Review and acknowledge the requirement first.');if(!weekly&&!quizResult?.passed)return alert('Pass the safety topic quiz first.');const checks=weekly?[...document.querySelectorAll('[data-check]')].map((el,i)=>({question:CHECKS[i],response:el.value})):[];const notes=weekly?$('#notes').value.trim():'';if(weekly&&(!$('#site').value.trim()||!$('#supervisor').value.trim()||checks.some(c=>!c.response)))return alert('Complete the site, supervisor and all safety checks.');if(weekly&&checks.some(c=>c.response!=='verified')&&!notes)return alert('Explain all issues and N/A answers.');const s={id:uid(),assignmentId:a.id,employeeId:who,submittedAt:new Date().toISOString(),topicVersion:topic(a.topicId)?.version||1,reviewAcknowledged:true,safetyQuiz:weekly?null:quizResult,signatureStatus:'not_requested',checks,notes,hazardCount:checks.filter(c=>c.response==='issue').length,site:weekly?$('#site').value:a.site,supervisor:weekly?$('#supervisor').value:'',weather:'',gc:''};db.submissions.push(s);checks.filter(c=>c.response==='issue').forEach(c=>db.actions.push({id:uid(),submissionId:s.id,employeeId:who,description:c.question+' — '+notes,created:s.submittedAt,status:'Open'}));save();active=null;tab='completed';render()}
function showSkills(){const a=db.skillAssignments.find(x=>x.id===active);$('#content').innerHTML=`<div class="card"><button class="btn secondary" id="back">← My assignments</button><h2>Installer Skills Assessment</h2><p class="muted">Due ${esc(a.due)}</p>${skillSet.map((q,i)=>`<div class="question"><strong>${i+1}. ${esc(q.q)}</strong>${q.choices.map((c,j)=>`<label><input type="radio" name="sk${i}" value="${j}"> ${esc(c)}</label>`).join('')}</div>`).join('')}<button class="btn" id="gradeSkills">Submit skills quiz</button></div>`;$('#back').onclick=()=>{active=null;render()};$('#gradeSkills').onclick=()=>{const responses=skillSet.map((q,i)=>document.querySelector(`input[name=sk${i}]:checked`)?.value);if(responses.some(x=>x==null))return alert('Answer every question.');const answers=responses.map(Number),score=Math.round(100*skillSet.filter((q,i)=>q.answer===answers[i]).length/skillSet.length);db.skillAttempts.unshift({id:uid(),assignmentId:a.id,employeeId:who,questions:structuredClone(skillSet),responses:answers,score,at:new Date().toISOString()});save();active=null;tab='completed';render()}}
function review(id,k){const a=k==='skills'?db.skillAssignments.find(x=>x.id===id):db.assignments.find(x=>x.id===id),s=k==='skills'?skillDone(a):done(a);if(!s)return;const t=k==='safety'?topic(a.topicId):null;$('#content').innerHTML=`<div class="card"><button class="btn secondary" id="back">← Completed</button><h2>${esc(k==='skills'?'Installer Skills':t?.title)}</h2><p class="muted">Completed ${esc(s.at||s.submittedAt)}</p>${k==='safety'?`${t?.pdfPath?`<p><a class="btn secondary" href="../${esc(t.pdfPath)}" target="_blank">Review training PDF</a></p>`:''}<div class="preview">${esc(t?.content||'')}</div>${s.safetyQuiz?`<h2>Quiz: ${s.safetyQuiz.score}%</h2>${s.safetyQuiz.items.map(x=>`<div class="question"><strong>${esc(x.question)}</strong><p>Your answer: ${esc(x.chosen)}<br>Correct answer: ${esc(x.expected)}<br>${esc(x.why)}</p></div>`).join('')}`:''}`:`<h2>Score: ${s.score}%</h2>${s.questions.map((q,i)=>`<div class="question"><strong>${esc(q.q)}</strong><p>Your answer: ${esc(q.choices[s.responses[i]])}<br>Correct answer: ${esc(q.choices[q.answer])}<br>${esc(q.explanation||'')}</p></div>`).join('')}`}</div>`;$('#back').onclick=render}
$('#person').onchange=e=>{who=e.target.value;active=null;render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;active=null;render()});$('#close').onclick=()=>$('#overlay').classList.add('hidden');render();
</script></body></html>
